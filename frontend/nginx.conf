server {
    # Same port inside the container as on the host, matching the backend's
    # 8000:8000. One number to remember per service instead of two.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # Everything below exists for SSE. Without proxy_buffering off, nginx
        # holds the whole event stream and delivers it in one lump at the end,
        # so the progress UI sits silent for 20 seconds and then jumps to done.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # No caching: the whole point of the volume mount is that a refresh
        # shows the edit.
        add_header Cache-Control "no-store";
    }
}
