<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ad Designer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0e1014',
            panel: '#15181f',
            edge: '#252a34',
            muted: '#8b93a3',
            accent: '#6ee7b7',
            warn: '#fbbf24',
            bad: '#f87171',
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #2b313c; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .drawer { transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .drawer.closed { transform: translateX(100%); }
    .fade-in { animation: fade .25s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .dots::after { content: '…'; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '…'; } }
  </style>
</head>
<body class="h-full bg-ink text-gray-100 antialiased">
<div class="flex h-full overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 shrink-0 border-r border-edge bg-panel flex flex-col">
    <div class="p-4 border-b border-edge">
      <div class="text-sm font-semibold tracking-tight">Ad Designer</div>
      <div class="text-[11px] text-muted mt-0.5">Commerce-media campaign builder</div>
    </div>
    <div class="p-3">
      <button id="new-session"
        class="w-full text-sm rounded-lg border border-edge hover:border-accent/50 hover:bg-white/5 py-2 transition">
        + New campaign
      </button>
    </div>
    <div id="session-list" class="flex-1 overflow-y-auto px-2 pb-3 space-y-1"></div>
    <div class="p-3 border-t border-edge text-[11px] text-muted leading-relaxed">
      Sessions live in the server's memory. Restarting the backend clears them.
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="px-8 py-5 border-b border-edge flex items-center justify-between gap-4">
      <div class="min-w-0">
        <h1 id="header-title" class="text-lg font-semibold tracking-tight truncate">
          Tell us about your business. We'll design the ads.
        </h1>
        <p id="header-sub" class="text-xs text-muted mt-0.5">
          Publishers, audiences, ad copy and a runnable campaign config.
        </p>
      </div>
      <button id="open-drawer"
        class="hidden shrink-0 text-sm font-medium rounded-lg bg-accent text-ink px-4 py-2 hover:brightness-110 transition">
        View campaign →
      </button>
    </header>

    <div id="transcript" class="flex-1 overflow-y-auto px-8 py-6"></div>

    <div id="composer-wrap" class="border-t border-edge px-8 py-4">
      <div id="samples" class="hidden mb-3 max-h-56 overflow-y-auto rounded-lg border border-edge bg-panel p-2 space-y-1"></div>
      <div class="flex gap-2 items-end">
        <textarea id="composer" rows="1" placeholder="We sell premium dog food for senior dogs…"
          class="flex-1 resize-none bg-panel border border-edge rounded-lg px-3 py-2.5 text-sm
                 focus:outline-none focus:border-accent/60 placeholder:text-muted/60 max-h-40"></textarea>
        <button id="toggle-samples" title="Sample briefs"
          class="shrink-0 text-xs rounded-lg border border-edge px-3 py-2.5 hover:bg-white/5 transition">Samples</button>
        <button id="send"
          class="shrink-0 text-sm font-medium rounded-lg bg-accent text-ink px-4 py-2.5 hover:brightness-110
                 disabled:opacity-40 disabled:cursor-not-allowed transition">Send</button>
      </div>
      <div id="composer-note" class="hidden mt-2 text-[11px] text-muted"></div>
    </div>
  </main>

  <!-- Drawer -->
  <section id="drawer"
    class="drawer closed fixed right-0 top-0 h-full w-[52rem] max-w-[92vw] bg-panel border-l border-edge
           shadow-2xl z-40 flex flex-col">
    <div class="px-6 py-4 border-b border-edge flex items-center justify-between gap-4">
      <div class="min-w-0">
        <div id="drawer-title" class="font-semibold tracking-tight truncate">Campaign</div>
        <div id="drawer-meta" class="text-[11px] text-muted mt-0.5"></div>
      </div>
      <button id="close-drawer" class="text-muted hover:text-white text-sm px-2 py-1">✕</button>
    </div>
    <nav class="px-6 pt-3 flex gap-1 border-b border-edge text-xs">
      <button data-tab="publishers" class="tab px-3 py-2 rounded-t-md border-b-2 border-accent text-white">Publishers</button>
      <button data-tab="audiences" class="tab px-3 py-2 rounded-t-md border-b-2 border-transparent text-muted hover:text-white">Audiences</button>
      <button data-tab="creatives" class="tab px-3 py-2 rounded-t-md border-b-2 border-transparent text-muted hover:text-white">Ad sets</button>
      <button data-tab="config" class="tab px-3 py-2 rounded-t-md border-b-2 border-transparent text-muted hover:text-white">Campaign config</button>
    </nav>
    <div id="drawer-body" class="flex-1 overflow-y-auto px-6 py-5"></div>
  </section>
  <div id="scrim" class="hidden fixed inset-0 bg-black/50 z-30"></div>
</div>

<script src="app.js"></script>
</body>
</html>
