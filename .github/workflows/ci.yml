name: CI

# What this does, and what it deliberately does not:
#
#   verify  — builds the image and runs the pipeline against stubbed LLM
#             responses. No API key, no network, runs on every push and PR.
#   smoke   — starts the real container with the repository secret and makes
#             two actual Gemini calls, to prove the key and the request shape
#             still work. Only on main and manual runs, to protect quota.
#   publish — pushes the image to GHCR so the app is one `docker run` away.
#
# GitHub cannot serve this app. Actions secrets are readable by jobs, never by
# a running web service, and Pages is static-only. See DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No API key may enter the repository
        run: |
          # Guards the one mistake that cannot be undone by a later commit.
          if git grep -nIE 'AIza[0-9A-Za-z_-]{30,}' -- . ; then
            echo "::error::A Google API key appears in tracked files."
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must stay local."
            exit 1
          fi
          echo "No keys in tracked files, .env untracked."

      - name: Frontend parses
        run: node --check frontend/public/app.js

      - name: Build backend image
        run: docker build -t ads-design-backend .

      - name: Image is self-contained
        run: |
          # Prompts, catalog and UI must live in the image, not only in the
          # compose mounts — otherwise it cannot deploy anywhere.
          docker run --rm ads-design-backend sh -c '
            test -f /prompts/publisher_scoring.md &&
            test -f /data/publishers.json &&
            test -f /static/index.html' && echo "prompts, catalog and UI baked in"

      - name: Pipeline invariants (stubbed LLM, no key needed)
        run: |
          docker run --rm -e GEMINI_API_KEY=offline-verification \
            ads-design-backend python verify_pipeline.py

  smoke:
    name: Live Gemini smoke test
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ads-design-backend .

      - name: Start with the real key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run -d --name app -p 8000:8000 -e GEMINI_API_KEY ads-design-backend
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"publishers":20'

      - name: UI is served from the same process
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/app.js)" = "200"

      - name: One real chat turn reaches Gemini
        run: |
          # Two calls: naming, then a streamed brief-collection turn. Enough to
          # prove the key, the schema and the streaming path; cheap enough to
          # run on every push to main.
          SID=$(curl -sf -X POST localhost:8000/api/sessions \
                  -H 'Content-Type: application/json' \
                  -d '{"initial_message":"We sell premium dog food for senior dogs."}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "session $SID"
          curl -sfN -X POST "localhost:8000/api/sessions/$SID/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"Average order is $70 and we can spend $300 a day."}' \
            | tee /tmp/turn.sse >/dev/null
          grep -q '^event: done' /tmp/turn.sse || { echo "::error::stream never completed"; exit 1; }
          grep -q '^event: delta' /tmp/turn.sse || { echo "::error::no streamed tokens"; exit 1; }
          echo "Streamed a real turn and completed."

      - name: Container logs must not contain the key
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The key moved to a header precisely so it stops appearing in httpx
          # request logs. This keeps it that way.
          if docker logs app 2>&1 | grep -qF "$GEMINI_API_KEY"; then
            echo "::error::The API key is being written to the container logs."
            exit 1
          fi
          echo "Key absent from logs."

      - name: Stop
        if: always()
        run: docker rm -f app || true

  publish:
    name: Publish image to GHCR
    needs: [verify, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
